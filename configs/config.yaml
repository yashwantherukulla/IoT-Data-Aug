# ================================================================= #
#  CGDAP v2.1 — Root Hydra Config                                   #
# ================================================================= #
#
# Config-group layout:
#   configs/
#   ├── config.yaml              ← you are here
#   ├── dataset/
#   │   └── har_dataset.yaml
#   ├── model/
#   │   ├── cgdap.yaml           # MultimodalCGDAP wrapper
#   │   └── unet.yaml            # ConditionalUNet defaults
#   ├── training/
#   │   └── default.yaml
#   ├── augmentation/
#   │   └── default.yaml
#   └── logging/
#       ├── console.yaml
#       └── wandb.yaml           # optional — swap in via CLI
#
# CLI overrides (no YAML edits needed):
#   uv run python scripts/train.py training.max_epochs=50
#   uv run python scripts/train.py model.unet.base_channels=64
#   uv run python scripts/train.py logging=wandb
# ================================================================= #

defaults:
  - dataset: har_dataset
  - model: cgdap
  - training: default
  - augmentation: default
  - evaluation: default
  - logging: console
  - _self_

# ----------------------------------------------------------------- #
#  Global                                                            #
# ----------------------------------------------------------------- #
seed: 42
experiment_name: "test_run"

# ----------------------------------------------------------------- #
#  Standalone Generation                                             #
# ----------------------------------------------------------------- #
generation:
  reference_pt: null
  checkpoint_path: null
  output_dir: "outputs/generated/${experiment_name}"
  dataset_split: null
  activity: null
  num_samples: 4
  num_steps: 1000
  seed: ${seed}
  sample_prefix: "demo"
  match_reference_label: true
  save_bundle: true
  save_modalities: true
  save_plots: true
  save_trajectory_plots: true
  trajectory_frames: 5
