# RealWorld HAR Dataset Configuration

seed: 42

dataset:
  paths:
    raw: "data/raw/HAR"
    processed: "data/processed/HAR"

  # Activities to process
  activities:
    - climbingdown
    - climbingup
    - jumping
    - running
    - walking

  # Output label mapping
  activity_map:
    climbingdown: climbing_down
    climbingup: climbing_up
    jumping: jumping
    running: running
    walking: walking

  # Windowing
  window_seconds: 2.5  # window length in seconds; samples per window = window_seconds * sample_rate_hz
  
  # Sampling frequency in Hz
  sample_rate_hz: 100.0
  # Spectrogram parameters
  spectrogram:
    fft_window_ms: 1500.0   # larger -> higher frequency resolution; n_fft derived from window size
    hop_ms: 20.0            # smaller -> higher time resolution (rounded to at least 1 sample)
    window: hann            # hann or hamming
    power: 1.0              # 2.0 = power, 1.0 = magnitude
    log1p: true             # log(1+x) compression

  # Differentiable metric extraction settings
  metrics:
    hps_downsample_factor: 2
    hps_softmax_beta: 20.0
    contrast_tail_ratio: 0.05
    eps: 1.0e-8

  # Train/val split
  split:
    num_train_subjects: 10
    num_val_subjects: 5

  # DataLoader settings (used by training code, not prepare_dataset)
  loader:
    batch_size: 32
    num_workers: 4
    pin_memory: true
    drop_last: false
