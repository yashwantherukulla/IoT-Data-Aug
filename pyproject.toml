[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iot-data-aug"
version = "2.1.0"
description = "CGDAP v2.1 — Conditional Generative Data Augmentation for HAR"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "torch>=2.10.0",
    "tqdm>=4.67",
    "wandb>=0.21",
    "numpy>=1.26",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["cgdap"]
