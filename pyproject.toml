[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iot-data-aug"
version = "2.1.0"
description = "CGDAP v2.1 — Conditional Generative Data Augmentation for HAR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.21",
    "numpy>=1.26",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "pytest>=8.0",
    "torch>=2.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["cgdap"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
default = false
